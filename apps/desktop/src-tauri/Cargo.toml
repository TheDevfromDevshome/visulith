[package]
name = "visulith-desktop"
version = "0.0.1"
description = "Visulith desktop shell"
authors = ["TheDevfromDevshome"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "visulith_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
